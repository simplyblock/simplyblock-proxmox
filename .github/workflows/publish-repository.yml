name: Publish Debian repository

# Called by the package workflow with a freshly built package, or run manually
# to rebuild, sign, and upload the repository from the debian branch as it is.
on:
  workflow_call:
    inputs:
      add-package:
        description: Add the debian_package artifact of the calling run
        type: boolean
        default: false
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: debian-repository-publish
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout debian branch
        uses: actions/checkout@v5
        with:
          ref: debian
          path: repository

      - name: Download package
        if: inputs.add-package
        uses: actions/download-artifact@v7
        with:
          name: debian_package
          path: package

      - name: Add the package
        if: inputs.add-package
        run: |
          mkdir -p repository/pool/main
          cp package/*.deb repository/pool/main/

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      # The key only exists in a temporary keyring during this step, so later
      # steps, including third-party actions, cannot read it.
      - name: Rebuild and sign the indexes
        env:
          DEBIAN_SIGNING_KEY: ${{ secrets.DEBIAN_SIGNING_KEY }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --import <<< "$DEBIAN_SIGNING_KEY"
          FINGERPRINT=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
          .github/scripts/build-debian-repository.sh repository "$FINGERPRINT"

      - name: Commit to the debian branch
        working-directory: ./repository
        env:
          ADD_PACKAGE: ${{ inputs.add-package }}
        run: |
          if [ "$ADD_PACKAGE" = "true" ]; then
            MESSAGE="chore(debian): publish ${GITHUB_REF_NAME}"
          else
            MESSAGE="chore(debian): rebuild the repository indexes"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$MESSAGE"
          git pull --rebase origin debian
          git push origin HEAD:debian

      - name: Publish to install.simplyblock.io via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.DEBIAN_FTP_USERNAME }}
          password: ${{ secrets.DEBIAN_FTP_PASSWORD }}
          protocol: ftps
          server-dir: /
          local-dir: ./repository/
